<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account | Pet Adoption</title>
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f5f5f5;
    }

    /* Navbar */
    .navbar {
        background-color: #333;
        color: white;
        padding: 15px 30px;
    }

    .navbar a {
        color: white;
        text-decoration: none;
        margin-right: 20px;
    }

    .navbar a:hover {
        text-decoration: underline;
    }

    /* Page */
    .page-container {
        display: flex;
        justify-content: center;
        padding: 50px 20px;
    }

    .register-card {
        width: 100%;
        max-width: 500px;
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.10);
    }

    .register-card h1 {
        text-align: center;
        color: #2d6a4f;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
    }

    /* Form */
    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #444;
    }

    .form-group input {
        width: 100%;
        padding: 13px;
        border: 1px solid #d5d5d5;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    .form-group input:focus {
        border-color: #2d6a4f;
        box-shadow: 0 0 0 2px rgba(45, 106, 79, 0.1);
    }

    /* Validation */
    .field-error {
        display: block;
        color: #842029;
        font-size: 13px;
        margin-top: 6px;
    }

    .error-message {
        background: #f8d7da;
        color: #842029;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    /* Register button */
    .register-button {
        width: 100%;
        background: #28282b;
        color: white;
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .register-button:hover {
        background: #22543d;
    }

    /* Login link */
    .login-link {
        text-align: center;
        margin-top: 25px;
    }

    .login-link a {
        color: #2d6a4f;
        text-decoration: none;
        font-weight: bold;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    footer {
        text-align: center;
        padding: 25px;
        color: #777;
    }

    @media (max-width: 650px) {
        .navbar {
            padding: 15px 20px;
        }

        .nav-links a {
            margin-left: 10px;
            font-size: 14px;
        }

        .register-card {
            padding: 25px;
        }
    }
</style>
<body>

    <div class="navbar">

        <!-- Visitor -->
        <a sec:authorize="isAnonymous()"
           th:href="@{/}">
            Home
        </a>

        <!-- Logged-in user -->
        <a sec:authorize="isAuthenticated()"
           th:href="@{/petAdoption/user/}">
            Home
        </a>

        <a th:href="@{/pets}">
            Pets
        </a>

        <!-- Visitor -->
        <a sec:authorize="isAnonymous()"
           th:href="@{/petAdoption/user/login}">
            Login
        </a>

        <a sec:authorize="isAnonymous()"
           th:href="@{/petAdoption/user/register}">
            Register
        </a>

        <!-- Logged-in user -->
        <a sec:authorize="isAuthenticated()"
           th:href="@{/petAdoption/user/applications}">
            My Applications
        </a>

        <a sec:authorize="isAuthenticated()"
           th:href="@{/petAdoption/user/history}">
            History
        </a>

    </div>

<div class="page-container">

    <div class="register-card">

        <h1>Create an Account</h1>

        <p class="subtitle">
            Join PetAdoption and start your adoption journey.
        </p>

        <div class="error-message"
             th:if="${error}"
             th:text="${error}">
        </div>

        <form method="post"
              th:action="@{/petAdoption/user/register}"
              th:object="${user}">

            <div class="form-group">
                <label>Full Name</label>

                <input type="text"
                       th:field="*{fullName}"
                       placeholder="Enter your full name">

                <span class="field-error"
                      th:if="${#fields.hasErrors('fullName')}"
                      th:errors="*{fullName}">
                </span>
            </div>

            <div class="form-group">
                <label>Phone Number</label>

                <input type="text"
                       th:field="*{phone}"
                       placeholder="Enter your phone number">

                <span class="field-error"
                      th:if="${#fields.hasErrors('phone')}"
                      th:errors="*{phone}">
                </span>
            </div>

            <div class="form-group">
                <label>Email</label>

                <input type="email"
                       th:field="*{email}"
                       placeholder="Enter your email">

                <span class="field-error"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}">
                </span>
            </div>

            <div class="form-group">
                <label>Password</label>

                <input type="password"
                       th:field="*{password}"
                       placeholder="Enter your password">

                <span class="field-error"
                      th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}">
                </span>
            </div>

            <div class="form-group">
                <label>Address</label>

                <input type="text"
                       th:field="*{address}"
                       placeholder="Enter your address">

                <span class="field-error"
                      th:if="${#fields.hasErrors('address')}"
                      th:errors="*{address}">
                </span>
            </div>

            <button type="submit"
                    class="register-button">
                Register
            </button>

        </form>

        <div class="login-link">
            Already have an account?

            <a th:href="@{/petAdoption/user/login}">
                Login Here
            </a>
        </div>

    </div>

</div>

<footer>
    PetAdoption
</footer>

</body>
</html>
