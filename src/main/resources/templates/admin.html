<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pet Adoption - Admin</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<h1>Admin - Adoption Requests</h1>

<!-- Flash messages -->
<div th:if="${successMessage}" style="color:green;" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" style="color:red;" th:text="${errorMessage}"></div>

<p>
    <a href="/petAdoption/admin/adoptionRequest">All Requests</a> |
    <a href="/petAdoption/admin/pendingAdoptionRequest">Pending Requests</a> |
    <a href="/petAdoption/admin/adoption/history">Adoption History</a>
</p>

<!-- All requests table -->
<table th:if="${viewRequest}" border="1">
    <tr>
        <th>ID</th>
        <th>User</th>
        <th>Pet</th>
        <th>Status</th>
        <th>Date</th>
        <th>Action</th>
    </tr>
    <tr th:each="req : ${viewRequest}">
        <td th:text="${req.id}"></td>
        <td th:text="${req.user.email}"></td>
        <td th:text="${req.pet.name}"></td>
        <td th:text="${req.status}"></td>
        <td th:text="${req.requestDate}"></td>
        <td>
            <form th:if="${req.status.name() == 'PENDING'}"
                  th:action="@{/petAdoption/admin/adoptionRequest/{id}/approve(id=${req.id})}"
                  method="post" style="display:inline;">
                <button type="submit">Approve</button>
            </form>
            <form th:if="${req.status.name() == 'PENDING'}"
                  th:action="@{/petAdoption/admin/adoptionRequest/{id}/reject(id=${req.id})}"
                  method="post" style="display:inline;">
                <button type="submit">Reject</button>
            </form>
        </td>
    </tr>
</table>

<!-- Pending requests table (same structure) -->
<table th:if="${viewPendingRequest}" border="1">
    <tr>
        <th>ID</th>
        <th>User</th>
        <th>Pet</th>
        <th>Date</th>
        <th>Action</th>
    </tr>
    <tr th:each="req : ${viewPendingRequest}">
        <td th:text="${req.id}"></td>
        <td th:text="${req.user.email}"></td>
        <td th:text="${req.pet.name}"></td>
        <td th:text="${req.requestDate}"></td>
        <td>
            <form th:action="@{/petAdoption/admin/adoptionRequest/{id}/approve(id=${req.id})}" method="post"
                  style="display:inline;">
                <button type="submit">Approve</button>
            </form>
            <form th:action="@{/petAdoption/admin/adoptionRequest/{id}/reject(id=${req.id})}" method="post"
                  style="display:inline;">
                <button type="submit">Reject</button>
            </form>
        </td>
    </tr>
</table>

<!-- Single request by id -->
<div th:if="${viewRequestById}">
    <p>ID: <span th:text="${viewRequestById.id}"></span></p>
    <p>Status: <span th:text="${viewRequestById.status}"></span></p>
    <p>Reason: <span th:text="${viewRequestById.reasonForAdoption}"></span></p>
</div>

<footer>
    <div th:replace="~{footer :: footer}"></div>
</footer>

</body>
</html>
