<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Adoption Applications</title>
    <link rel="stylesheet" th:href="@{/style.css}">

    <style>
        .container {
            max-width: 1400px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .tab-btn{
            .login-button{
                width:75px;
                background:#28282b;
                color:white;
                border:none;
                padding:14px;
                border-radius:8px;
                font-size:16px;
                cursor:pointer;
                font-weight:bold;
                transition:.25s;
            }

        }
        th, td {
            border: 1px solid #dddddd;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #2d6a4f;
            color: white;
        }

        .success-message {
            color: #155724;
            background-color: #d4edda;
            padding: 10px;
            border-radius: 5px;
        }

        .error-message {
            color: #721c24;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 5px;
        }

        .PENDING {
            color: #b8860b;
            font-weight: bold;
        }

        .APPROVED {
            color: #198754;
            font-weight: bold;
        }

        .REJECTED {
            color: #dc3545;
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>
<div th:replace="~{navbar :: navbar}"></div>


<div class="container">
    <div class="admin-container">

        <div class="admin-header">


            <h1>My Adoption Applications</h1>

            <div class="success-message"
                 th:if="${successMessage}"
                 th:text="${successMessage}">
            </div>

            <div class="error-message"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}">
            </div>

            <p th:if="${#lists.isEmpty(applications)}">
                You have not submitted any adoption applications.
            </p>

            <table th:unless="${#lists.isEmpty(applications)}">

                <thead>
                <tr>
                    <th>Application ID</th>
                    <th>Pet Name</th>
                    <th>Species</th>
                    <th>Breed</th>
                    <th>Request Date</th>
                    <th>Home Type</th>
                    <th>Other Pets</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="app : ${applications}">

                    <td th:text="${app.id}">
                        1
                    </td>

                    <td th:text="${app.pet.name}">
                        Pet Name
                    </td>

                    <td th:text="${app.pet.species}">
                        Dog
                    </td>

                    <td th:text="${app.pet.breed}">
                        Labrador
                    </td>

                    <td th:text="${#temporals.format(
                    app.requestDate,
                    'MMM dd, yyyy HH:mm')}">
                        Date
                    </td>

                    <td th:text="${app.homeType}">
                        House
                    </td>

                    <td th:text="${app.hasOtherPets ? 'Yes' : 'No'}">
                        No
                    </td>

                    <td>
                <span th:text="${app.status}"
                      th:class="${app.status.name()}">
                    PENDING
                </span>
                    </td>

                </tr>

                </tbody>

            </table>


        </div>
        <a class="tab-btn"
           th:href="@{/pets}">
            Browse More Pets
        </a>
    </div>
</div>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
