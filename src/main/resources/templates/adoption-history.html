<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Adoption History</title>
    <link rel="stylesheet" th:href="@{/style.css}">

</head>

<body>

<div th:replace="~{navbar :: navbar}"></div>

<div class="content-wrapper">

    <div class="admin-container">
        <div class="admin-header">

            <h1>Adoption History</h1>

            <p th:if="${#lists.isEmpty(history)}">
                No completed adoption records were found.
            </p>

            <table th:unless="${#lists.isEmpty(history)}">

                <thead>
                <tr>
                    <th>History ID</th>
                    <th>Pet Name</th>
                    <th>Species</th>
                    <th>Breed</th>
                    <th>Adopter Name</th>
                    <th>Email</th>
                    <th>Adoption Date</th>
                    <th>Application ID</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="record : ${history}">

                    <td th:text="${record.id}">
                        1
                    </td>

                    <td th:text="${record.pet.name}">
                        Pet Name
                    </td>

                    <td th:text="${record.pet.species}">
                        Dog
                    </td>

                    <td th:text="${record.pet.breed}">
                        Labrador
                    </td>

                    <td th:text="${record.user.fullName}">
                        User Name
                    </td>

                    <td th:text="${record.user.email}">
                        user@example.com
                    </td>

                    <td th:text="${#temporals.format(
                    record.adoptionDate,
                    'MMM dd, yyyy')}">
                        Date
                    </td>

                    <td th:text="${record.adoptionRequest.id}">
                        1
                    </td>

                </tr>

                </tbody>

            </table>

        </div>
    </div>
</div>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
