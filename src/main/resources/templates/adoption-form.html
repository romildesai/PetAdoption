<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pet Adoption Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        .pet-information {
            background-color: #eef6ff;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #146c43;
        }

        .error-message {
            color: #dc3545;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Pet Adoption Application</h1>

    <div class="error-message"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <div class="pet-information" th:if="${pet != null}">

        <h2 th:text="${pet.name}">
            Pet Name
        </h2>

        <p>
            <strong>Species:</strong>
            <span th:text="${pet.species}">
                Dog
            </span>
        </p>

        <p>
            <strong>Breed:</strong>
            <span th:text="${pet.breed}">
                Labrador
            </span>
        </p>

        <p>
            <strong>Age:</strong>
            <span th:text="${pet.age}">
                3
            </span>
        </p>

        <p>
            <strong>Status:</strong>
            <span th:text="${pet.status}">
                AVAILABLE
            </span>
        </p>

    </div>

    <form th:action="@{/adoptions}" method="post">

        <!-- Temporary user ID -->
        <input type="hidden"
               name="userId"
               value="1">

        <input type="hidden"
               name="petId"
               th:value="${pet.id}">

        <label for="reasonForAdoption">
            Why do you want to adopt this pet?
        </label>

        <textarea id="reasonForAdoption"
                  name="reasonForAdoption"
                  placeholder="Explain why you want to adopt this pet"
                  minlength="10"
                  required></textarea>

        <label for="homeType">
            What type of home do you live in?
        </label>

        <select id="homeType"
                name="homeType"
                required>

            <option value="">
                Select your home type
            </option>

            <option value="Apartment">
                Apartment
            </option>

            <option value="Condo">
                Condo
            </option>

            <option value="House">
                House
            </option>

            <option value="Townhouse">
                Townhouse
            </option>

        </select>

        <label for="hasOtherPets">
            Do you currently have other pets?
        </label>

        <select id="hasOtherPets"
                name="hasOtherPets"
                required>

            <option value="">
                Select an option
            </option>

            <option value="true">
                Yes
            </option>

            <option value="false">
                No
            </option>

        </select>

        <label for="experienceWithPets">
            Describe your experience with pets
        </label>

        <textarea id="experienceWithPets"
                  name="experienceWithPets"
                  placeholder="Describe any previous experience with pets"></textarea>

        <button type="submit">
            Submit Adoption Request
        </button>

    </form>

    <a class="back-link"
       th:href="@{/pets}">
        Back to Pets
    </a>

</div>

</body>
</html>
