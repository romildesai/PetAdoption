<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Pet Adoption</title>
</head>
<body>
<h2>Login</h2>
<p th:if="${param.error}" style="color:red;">
    Invalid email or password.
</p>
<p th:if="${param.logout}" style="color:green;">
    You have been logged out successfully.
</p>

<form method="post" th:action="@{/login}">
    <label>Email: <input type="email"
                            name="email" required/></label><br/>
    <label>Password: <input type="password"
                            name="password" required/></label><br/>
    <input type="submit" value="Login"/>
</form>
<p>
    Don't have an account?
    <a th:href="@{/petAdoption/user/register}">Register</a>
</p>
</body>
</html>
